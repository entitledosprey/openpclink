[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openpclink"
version = "0.1.0"
description = "Unofficial macOS/Linux tuning client for Link G4X and G5 ECUs"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "pyftdi>=0.55", "pyusb>=1.2", "PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
openpclink = "openpclink.cli:main"

[project.gui-scripts]
openpclink-gui = "openpclink.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
